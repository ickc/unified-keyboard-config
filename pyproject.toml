[project]
authors = [{name = "Kolen Cheung", email = "christian.kolen@gmail.com"}]
dependencies = []
name = "unified-keyboard-config"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "linux-aarch64", "osx-64", "osx-arm64"]

[tool.pixi.pypi-dependencies]
unified_keyboard_config = { path = ".", editable = true }

[tool.pixi.tasks]
submodule-init = { cmd = "git submodule update --init --recursive", description = "Initialize submodules after cloning" }
submodule-update = { cmd = "git submodule update --remote --recursive", description = "Update submodules from remote" }
update-moonlander = { cmd = "python -m unified_keyboard_config.cli pull submodule/Moonlander-Mk1-QMK --patch", description = "Update Moonlander firmware source from Oryx and patch it" }
patch-moonlander = { cmd = "python -m unified_keyboard_config.cli patch submodule/Moonlander-Mk1-QMK/src/keymap.c", description = "Patch Moonlander keymap with custom layout" }

[tool.pixi.activation.env]
ORYX_LAYOUT_ID = "QwA3z"
ORYX_GEOMETRY = "moonlander"
